project_name: "HAI_2025_EffB5_FewShot"
experiment_name: "effnet_b5_fewshot"

data:
  train_dir: "data/raw/real_vs_fake/real-vs-fake/train" # Main data (Will be mixed with Pseudo)
  val_dir: "data/raw/real_vs_fake/real-vs-fake/valid"
  test_dir: "data/raw/real_vs_fake/real-vs-fake/test"
  dacon_test_dir: "data/test"
  img_size: 224
  batch_size: 32 # EfficientNet-B5 is lighter than DINO
  num_workers: 4

model:
  backbone: "efficientnet_b5"
  pretrained: false # Load from checkpoint
  num_classes: 2
  dropout: 0.4

train:
  epochs: 2 # Just 1-2 epochs for adaptation
  lr: 0.00001 # Very low LR for fine-tuning
  weight_decay: 1e-4
  scheduler: "CosineAnnealingLR"
  min_lr: 1e-7
  device: "cuda"
  seed: 42
  save_dir: "checkpoints"
  log_interval: 50
